<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up</title>
    <link rel="stylesheet" href="./signup.css"
</head>
<body>
    <header>
      <div class="navbar">
        <div class="company-name">
            <h1>To Do </h1>
        </div>
        <ul class="nav-menu">
            <li class="nav-item">
                <a href="./To do list.html" class="nav-link">Home</a>
            </li>
             <li class="nav-item">
                <a href="./login.html" class="nav-link">login</a>
            </li>
        </ul>
      </div>
    </header>
     <main>
        <div class="signup-container">
            <div class="title">
                Signup Here
            </div>
            <div class="signup-credentials">
               <div class="fristname">
                <input type="text" class="fristname-input" id="fristname" placeholder="Enter Frist name">
               </div>
                 <div class="middlename">
                <input type="text" class="middlename-input" id="middlename" placeholder="Enter middle name">
               </div>
                 <div class="lastname">
                <input type="text" class="lastname-input" id="lastname" placeholder="Enter last name">
                 </div>
                 <div class="email">
               <input type="email" name="userEmail" id="userEmail" class="userEmail" placeholder="Enter E-mail">
               </div>
               <div class="password">
                <input type="password" name="password" class="password" id="password" placeholder="Create a password">
               </div>
               <div class="comfirmpassword">
                <input type="password" name="confirmpassword" id="comfirmpassword" class="confirmpassword" placeholder="Confirm password">
               </div>
               <div class="signup-button-container">
                <button class="signup-botton">Signup</button>
                <button class="cancel-button">Cancel</button>
               </div>
            </div>

        </div>
    </main>
    
</body>
</html>
