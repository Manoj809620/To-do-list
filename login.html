<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./login.css">
</head>
<body>
    <header>
      <div class="navbar">
        <div class="company-name">
            <h1>To Do </h1>
        </div>
        <ul class="nav-menu">
            <li class="nav-item">
                <a href="./To do list.html" class="nav-link">Home</a>
            </li>
             <li class="nav-item">
                <a href="./login.html" class="nav-link">login</a>
            </li>
        </ul>
      </div>
    </header>
    <main>
        <div class="login-container">
            <div class="title">
                Login Here
            </div>
            <div class="login-credentials">
                <div class="username-input-container">
                    
                    <input type="text" class="username" id="username" name="username" placeholder="username | ex:jhon8421@gmail.com">
                </div>
                <div class="password-input-container">
                    
                    <input type="password" name="password" id="password" class="password" placeholder=" password| ex : 1234">
                </div>
                <div class="login-button-container">
                    <button class="login-button">Login</button>
                    <button class="cancel-button">Cancel</button>
                </div>
                <div class="register-button-container">
                    Not having an account? <a href="./signup.html">Sign up</a>here.
                   
                </div>
            </div>
        </div>
    </main>
</body>
</html>
